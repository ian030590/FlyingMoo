[package]
name = "flyingmoo"
version = "1.3.0"
default-run = "flyingmoo"
description = "FlyingMoo desktop head-control game"
authors = ["FlyingMoo contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tiny_http = "0.12"

[[bin]]
name = "flyingmoo-tobii-bridge"
path = "src/tobii-bridge.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
