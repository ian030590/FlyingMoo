name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare offline assets
        run: npm run prepare-assets
      - name: JavaScript tests
        run: npm test
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Native tests
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - name: Build portable executable
        run: npm run build
      - name: Check executable startup and write checksum
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
          if ($executables.Count -ne 2) { throw 'Expected the desktop and Tobii bridge executables' }
          $executable = $executables | Where-Object Name -Like '*portable.exe'
          $application = Start-Process -FilePath $executable.FullName -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($application.HasExited) { throw "Application exited during startup: $($application.ExitCode)" }
          } finally {
            if (!$application.HasExited) { Stop-Process -Id $application.Id }
          }
          $executables | ForEach-Object {
            $releaseHash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($releaseHash.Hash.ToLower())  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FlyingMoo-windows-portable
          path: dist/
          if-no-files-found: error
